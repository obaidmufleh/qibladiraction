:root {
  --gold: #c9a84c;
  --gold-light: #e8d08a;
  --gold-dark: #8a6a20;
  --bg: #0a0c0f;
  --bg2: #111318;
  --bg3: #1a1d24;
  --text: #e8e0d0;
  --text-muted: #7a7060;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Josefin Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden;
  transition: direction 0.3s ease;
}

body::before {
  content: ''; position: fixed; inset: 0;
  background-image:
    radial-gradient(1px 1px at 15% 20%, rgba(201,168,76,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 10%, rgba(201,168,76,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 60%, rgba(201,168,76,0.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 70%, rgba(201,168,76,0.3) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 25% 45%, rgba(232,208,138,0.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 70% 85%, rgba(232,208,138,0.4) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 50%  5%, rgba(232,208,138,0.45) 0%, transparent 100%);
  pointer-events: none; z-index: 0;
}

.lang-toggle {
  position: absolute; top: 15px; right: 15px;
  background: transparent; border: 1px solid rgba(201,168,76,0.3);
  color: var(--gold); border-radius: 4px; padding: 6px 14px;
  font-family: 'Amiri', serif; font-size: 1.1rem; cursor: pointer;
  transition: all 0.2s; z-index: 10;
}
